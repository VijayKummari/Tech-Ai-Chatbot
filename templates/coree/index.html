{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tech AI Chatbot</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

<div class="container">

    <div class="logo">

        🤖

        <h1>Tech AI Chatbot</h1>

    </div>

    <div class="tagline">

        Ask me anything. I'm here to help ❤️

    </div>

    <form method="POST">

        {% csrf_token %}

        <div class="input-box">

            <input
            type="text"
            name="question"
            placeholder="Ask me anything..."
            required>

            <button>

                Send

            </button>

        </div>

    </form>

    {% if answer %}

    <div class="chat-area">

        <div class="bot-message">

            <div class="bot-icon">

                🤖

            </div>

            <div class="message">

                {{ answer|safe }}

            </div>

        </div>

    </div>

    {% endif %}

</div>

</body>

</html>
